name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release. Leave empty to only build."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            asset: HAC_Autoclicker-windows.exe
          - target: linux
            os: ubuntu-latest
            asset: HAC_Autoclicker-linux.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash build.sh

      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/HAC_Autoclicker.exe dist/HAC_Autoclicker-windows.exe
          else
            tar -czf dist/HAC_Autoclicker-linux.tar.gz -C dist HAC_Autoclicker
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true